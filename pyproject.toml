[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-kernel"
version = "0.1.0"
description = "A behavioral kernel for LLM agents: composable rule modules, documented rationale, testable compliance"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "BrainboxAI" }]
keywords = ["llm", "agents", "system-prompt", "prompt-engineering", "evals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Brainboxai-IL/agent-kernel"
Repository = "https://github.com/Brainboxai-IL/agent-kernel"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

# the "package" ships prompt files, not importable code
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
