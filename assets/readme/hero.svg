<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">agent-kernel</title>
  <desc id="desc">agent-kernel by BrainboxAI: five behavioral modules composed into ready-to-use agent profiles, with documented rationale and compliance probes.</desc>

  <rect width="1200" height="380" rx="26" fill="#0A0E14"/>

  <!-- title block -->
  <g id="title-block" transform="translate(64 78)">
    <g id="motif-eyebrow">
      <rect x="0" y="-14" width="18" height="18" rx="5" fill="none" stroke="#3D8BFD" stroke-width="1.5"/>
      <circle cx="9" cy="-5" r="3" fill="#3D8BFD"/>
    </g>
    <text x="30" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="17" letter-spacing="4" fill="#3D8BFD">BRAINBOXAI &#183; AGENT INFRASTRUCTURE</text>

    <text x="0" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
          font-size="58" font-weight="700" fill="#EAF0F7">agent-kernel</text>

    <text x="0" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
          font-size="23" fill="#B8C2D0">A behavioral kernel for LLM agents: composable rule</text>
    <text x="0" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
          font-size="23" fill="#B8C2D0">modules, documented rationale, testable compliance.</text>

    <text x="0" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="16" fill="#7E8BA0">modules/ &#183; profiles/ &#183; RATIONALE &#183; EVALS &#183; works with any LLM</text>
  </g>

  <!-- system map: modules -> compose -> profiles -->
  <g id="project-proof" transform="translate(620 36)">

    <!-- module chips -->
    <g id="modules" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">
      <rect x="0" y="20" width="168" height="40" rx="12" fill="#101724" stroke="#24303F" stroke-width="1.5"/>
      <text x="16" y="46" fill="#B8C2D0">communication</text>
      <rect x="0" y="72" width="168" height="40" rx="12" fill="#101724" stroke="#24303F" stroke-width="1.5"/>
      <text x="16" y="98" fill="#B8C2D0">autonomy</text>
      <rect x="0" y="124" width="168" height="40" rx="12" fill="#101724" stroke="#24303F" stroke-width="1.5"/>
      <text x="16" y="150" fill="#B8C2D0">integrity</text>
      <rect x="0" y="176" width="168" height="40" rx="12" fill="#101724" stroke="#24303F" stroke-width="1.5"/>
      <text x="16" y="202" fill="#B8C2D0">caution</text>
      <rect x="0" y="228" width="168" height="40" rx="12" fill="#101724" stroke="#24303F" stroke-width="1.5"/>
      <text x="16" y="254" fill="#B8C2D0">code</text>
    </g>

    <!-- convergence into the kernel node -->
    <g id="in-edges" stroke="#24303F" stroke-width="1.5" fill="none">
      <path d="M168 40  C 196 40,  200 144, 222 144"/>
      <path d="M168 92  C 196 92,  200 144, 222 144"/>
      <path d="M168 144 L 222 144"/>
      <path d="M168 196 C 196 196, 200 144, 222 144"/>
      <path d="M168 248 C 196 248, 200 144, 222 144"/>
    </g>

    <!-- kernel node: brainbox motif -->
    <g id="kernel-node" transform="translate(222 122)">
      <rect x="0" y="0" width="44" height="44" rx="12" fill="#13203A" stroke="#3D8BFD" stroke-width="2"/>
      <circle cx="22" cy="22" r="6" fill="#3D8BFD"/>
    </g>

    <!-- fan-out to profiles -->
    <g id="out-edges" stroke="#24303F" stroke-width="1.5" fill="none">
      <path d="M266 144 C 284 144, 284 70,  300 70"/>
      <path d="M266 144 C 284 144, 284 158, 300 158"/>
      <path d="M266 144 C 284 144, 284 246, 300 246"/>
    </g>

    <!-- profile cards -->
    <g id="profiles" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">
      <rect x="300" y="40" width="210" height="60" rx="14" fill="#101724" stroke="#24303F" stroke-width="1.5"/>
      <text x="320" y="76" fill="#EAF0F7">assistant</text>

      <rect x="300" y="124" width="210" height="68" rx="14" fill="#13203A" stroke="#3D8BFD" stroke-width="2"/>
      <text x="320" y="164" fill="#EAF0F7">coding-agent</text>
      <circle cx="488" cy="158" r="4" fill="#3D8BFD"/>

      <rect x="300" y="216" width="210" height="60" rx="14" fill="#101724" stroke="#24303F" stroke-width="1.5"/>
      <text x="320" y="252" fill="#EAF0F7">autonomous-agent</text>
    </g>

    <text x="300" y="322" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="16" fill="#7E8BA0">compose &#8594; deploy &#8594; probe</text>
  </g>
</svg>
