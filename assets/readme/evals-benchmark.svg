<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"
     role="img" aria-labelledby="title desc">
  <title id="title">Behavior tests passed per model, baseline vs agent-kernel</title>
  <desc id="desc">Grouped vertical bar chart of five models. With the agent-kernel profile every model passes more behavior-test runs than with a baseline prompt: qwen3-4b 56 to 96 percent, GPT-5.5 54 to 100, Llama-3.3-70B 47 to 93, DeepSeek-v3.1 41 to 100, Gemma-3-27B 62 to 77.</desc>
  <rect width="1200" height="620" rx="26" fill="#0A0E14"/>

  <text x="64" y="60" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="700" fill="#EAF0F7">Behavior tests passed (%), five models</text>
  <text x="64" y="90" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#7E8BA0">same probes, same grading criteria &#183; adaptive runs &#183; method, raw outputs and caveats in RESULTS.md</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">
    <rect x="64" y="112" width="14" height="14" rx="3" fill="#C0722E"/>
    <text x="86" y="124" fill="#B8C2D0">baseline prompt</text>
    <rect x="266" y="112" width="14" height="14" rx="3" fill="#3D8BFD"/>
    <text x="288" y="124" fill="#B8C2D0">with agent-kernel</text>
  </g>

