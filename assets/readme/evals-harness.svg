  <title id="title">Harness probes passed per model, baseline vs agent-kernel, real tools</title>
  <desc id="desc">Grouped vertical bar chart of four models running a real coding agent with tools, graded from disk state. GLM 5.2 goes from 67 to 100 percent with the kernel, MiMo-V2.5 from 53 to 80, gpt-oss-120b stays at 40, and Llama-3.3-70B drops from 33 to 20.</desc>
  <rect width="1200" height="620" rx="26" fill="#0A0E14"/>

  <text x="64" y="60" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="700" fill="#EAF0F7">Harness probes passed (%), real tools</text>
  <text x="64" y="90" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#7E8BA0">pi agent with read/bash/edit/write &#183; graded from disk state &#183; 3 runs per cell &#183; method and caveats in RESULTS.md</text>

