  <title id="title">27 behavior tests, with and without agent-kernel</title>
  <desc id="desc">Two bars. The baseline prompt passes 15 of 27 behavior tests, 56 percent. With the agent-kernel profile the same model passes 26 of 27, 96 percent.</desc>
  <rect width="1200" height="470" rx="26" fill="#0A0E14"/>

