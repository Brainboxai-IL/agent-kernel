  <text x="64" y="104" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#7E8BA0">a system prompt built from agent-kernel modules</text>

  <line x1="1120" y1="136" x2="1120" y2="364" stroke="#1A2230" stroke-width="1"/>
  <text x="1120" y="390" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#7E8BA0">100%</text>

